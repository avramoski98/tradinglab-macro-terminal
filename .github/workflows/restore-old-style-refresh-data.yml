name: Restore original UI and refresh weekly data
on:
  push:
    paths:
      - '.github/workflows/restore-old-style-refresh-data.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update data only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Keep the original G10 matrix/calendar renderer and styling. Update data only.
          static_cal="""const STATIC_CAL=[
          ["2026-09-07","08:00","EUR","Germany Industrial Production · Jul","—","—","—","MED","Checks whether German activity is stabilising ahead of the ECB.","Better activity supports EUR breadth; weak data matters only if rates/guidance soften too."],
          ["2026-09-07","10:30","GBP","UK Construction PMI · Aug","—","—","—","MED","Secondary UK activity check before Friday GDP.","Use as confirmation only; Friday GDP and labor/inflation matter more."],
          ["2026-09-08","08:00","EUR","Germany Trade Balance · Jul","—","—","—","MED","External-demand check for the Euro Area growth story.","A large deterioration is a warning; otherwise secondary to ECB."],
          ["2026-09-08","08:45","EUR","France Trade Balance · Jul","—","—","—","MED","Regional activity / external-demand confirmation.","Secondary unless it materially changes Euro Area growth expectations."],
          ["2026-09-09","14:30","CAD","Building Permits · Jul","—","—","—","MED","Canada activity check after the August labor miss.","Weak activity reinforces CAD caution; a strong beat alone does not override labor weakness."],
          ["2026-09-10","08:00","GBP","UK RICS House Price Balance · Aug","—","—","—","MED","Housing / domestic-demand signal.","Supporting evidence only ahead of Friday GDP."],
          ["2026-09-10","14:15","EUR","ECB Rate Decision","—","25bp hike widely priced","—","EXTREME","Main EUR event. The rate move itself is largely priced; guidance and projections matter more.","Hike + hawkish guidance / higher inflation path → EUR stronger. Hike + pause language → sell-the-fact risk."],
          ["2026-09-10","14:30","USD","PPI · Aug","—","Consensus pending/live feed","—","VERY HIGH","First US inflation test before CPI.","Hot PPI + US2Y higher → supports Fed hike pricing. Cool PPI matters most if front-end yields fall."],
          ["2026-09-10","14:45","EUR","ECB Press Conference · Lagarde","—","—","—","EXTREME","Guidance, inflation projections and December optionality are the real EUR catalyst.","Listen for whether policy remains restrictive / further hikes possible versus a clear pause signal."],
          ["2026-09-10","16:00","USD","Wholesale Inventories · Jul final","—","—","—","MED","Secondary growth / inventory input.","Do not re-rank USD unless it materially changes growth expectations."],
          ["2026-09-11","08:00","GBP","UK GDP · Jul / 3M","—","Consensus live in calendar","—","VERY HIGH","Key GBP growth catalyst.","Strong growth can support GBP; weak GDP plus soft labor keeps BoE constrained."],
          ["2026-09-11","08:00","GBP","UK Industrial + Manufacturing Production · Jul","—","Consensus live in calendar","—","HIGH","Breadth check around the GDP release.","Read together with GDP; avoid double-counting one monthly shock."],
          ["2026-09-11","08:00","GBP","UK Trade Balance · Jul","—","Consensus live in calendar","—","MED","External-demand component of the UK growth print.","Secondary to GDP / production."],
          ["2026-09-11","14:30","USD","CPI · Aug","Headline prior 3.7% PCE context","Headline ~0.4% m/m · Core ~0.2% m/m","—","EXTREME","THE EVENT OF THE WEEK. Inflation decides whether strong August labor justifies the September Fed hike.","Core ≤0.2% + US2Y lower → bearish USD repricing. Core ≥0.3–0.4% + US2Y >4.40% → hawkish Fed confirmation."],
          ["2026-09-11","14:30","USD","Core CPI · Aug","—","~0.2% m/m","—","EXTREME","Most important part of the CPI report for the Fed reaction function.","Core and shelter/services composition matter more than headline alone."],
          ["2026-09-11","14:30","USD","Initial Jobless Claims","—","Consensus live in calendar","—","HIGH","Labor cross-check after strong August payrolls.","Only matters if it conflicts sharply with the NFP narrative."],
          ["2026-09-11","16:00","USD","University of Michigan Sentiment · prelim","—","Consensus live in calendar","—","HIGH","Consumer demand + inflation expectations cross-check.","Inflation expectations are more relevant than headline sentiment for Fed pricing."]
          ];"""
          s=re.sub(r"const STATIC_CAL=\[.*?\];\nconst ORDER=", static_cal+"\nconst ORDER=", s, count=1, flags=re.S)

          # Add the decisive Sep 4 releases to the catalyst history without touching UI.
          add="""
           {date:'2026-09-04T14:30:00+02:00',ccy:'USD',event:'Nonfarm Payrolls · Aug',kind:'NFP',actual:'+162k',forecast:'~56k',previous:'Jul revised',result:'BEAT',score:3,highImpact:true,why:'August payrolls materially beat expectations, validating part of the hawkish Fed repricing.'},
           {date:'2026-09-04T14:30:00+02:00',ccy:'USD',event:'Unemployment Rate · Aug',kind:'UNEMPLOYMENT',actual:'4.1%',forecast:'4.1%',previous:'4.1%',result:'NEUTRAL',score:0,highImpact:true,why:'Unemployment stayed at 4.1%; labor did not weaken enough to challenge the stronger payroll print.'},
           {date:'2026-09-04T14:30:00+02:00',ccy:'USD',event:'Average Hourly Earnings · Aug',kind:'WAGES',actual:'3.1% y/y',forecast:'—',previous:'3.2% y/y',result:'COOLER',score:-0.5,highImpact:true,why:'Wage growth cooled slightly, preventing the labor report from becoming an unambiguously inflationary signal.'},
           {date:'2026-09-04T14:30:00+02:00',ccy:'CAD',event:'Employment Change · Aug',kind:'NFP',actual:'-41.7k',forecast:'+15k',previous:'+75k',result:'MISS',score:-3,highImpact:true,why:'Canadian employment reversed sharply, weakening the CAD labor pillar despite earlier growth resilience.'}
          """
          s=s.replace("\n];\nfunction catalystKind", ","+add+"\n];\nfunction catalystKind", 1)

          # Refresh key macro text/rates, preserving the original matrix columns and CSS.
          s=s.replace('Week of 31 Aug–4 Sep','Week of 7–11 Sep')
          s=s.replace('WEEK OF 31 AUG – 4 SEP 2026','WEEK OF 7–11 SEP 2026')
          s=s.replace('Confirmation Week · Inflation → Central Banks → Labor','ECB + US Inflation Week · Guidance → CPI → 2Y Confirmation')
          s=s.replace("Friday NFP confirms or rejects the hawkish repricing.","Friday CPI confirms or rejects whether the stronger August labor report can justify a September Fed hike.")
          s=s.replace("Tuesday CPI tests the September ECB hike.","Thursday ECB is largely priced; guidance and projections decide the EUR reaction.")
          s=s.replace("RBNZ is Wednesday's binary event; AUD GDP tests whether sticky inflation can coexist with weak growth; JPY remains supported by BoJ normalization and intervention risk.","US labor has now materially strengthened the Fed-hike case, but CPI is the deciding confirmation. ECB is Thursday's main EUR catalyst; JPY remains supported by BoJ normalization while CAD labor weakened sharply.")

          # Update key USD / EUR / CAD evidence inside RES block without redesigning it.
          usd_pat=r'("USD":\{.*?\})(,"JPY":\{)'
          m=re.search(usd_pat,s,re.S)
          if m:
              b=m.group(1)
              b=re.sub(r'"labor":"[^"]*"','"labor":"Strengthened / Resilient"',b,1)
              b=re.sub(r'"laborTone":"[^"]*"','"laborTone":"green"',b,1)
              b=re.sub(r'"trendDetail":"[^"]*"','"trendDetail":"August payrolls rose 162k versus roughly 56k expected, unemployment held 4.1%, participation improved and prior months were revised higher. Wage growth eased to 3.1% y/y. The labor pillar now confirms part of the hawkish Fed repricing; CPI is the next decisive test."',b,1)
              b=re.sub(r'"next":"[^"]*"','"next":"Sep hike is a real base-case contender; CPI must confirm"',b,1)
              b=re.sub(r'"y2":"[^"]*"','"y2":"US 2Y ~4.37% · post-NFP"',b,1)
              b=re.sub(r'"confidence":"[^"]*"','"confidence":"HIGH / CPI-DEPENDENT"',b,1)
              b=re.sub(r'"weekly":"[^"]*"','"weekly":"Friday CPI is the deciding confirmation. Strong labor + sticky inflation + US2Y higher would validate the hike; soft core CPI + lower US2Y would revive the bearish-USD case."',b,1)
              s=s[:m.start(1)]+b+s[m.end(1):]
          eur_pat=r'("EUR":\{.*?\})(,"USD":\{)'
          m=re.search(eur_pat,s,re.S)
          if m:
              b=m.group(1)
              b=re.sub(r'"core":"[^"]*"','"core":"Core HICP 2.4% · Aug flash"',b,1)
              b=re.sub(r'"inflation":"[^"]*"','"inflation":"Headline HICP 3.3% · energy-led, core 2.4%"',b,1)
              b=re.sub(r'"next":"[^"]*"','"next":"10 Sep hike heavily priced; guidance decides follow-through"',b,1)
              b=re.sub(r'"weekly":"[^"]*"','"weekly":"Thursday ECB decision and Lagarde guidance are the key EUR test. The hike itself is largely priced; projections and December optionality decide whether EUR can extend."',b,1)
              s=s[:m.start(1)]+b+s[m.end(1):]
          cad_pat=r'("CAD":\{.*?\})(,"NZD":\{)'
          m=re.search(cad_pat,s,re.S)
          if m:
              b=m.group(1)
              b=re.sub(r'"labor":"[^"]*"','"labor":"Deteriorating"',b,1)
              b=re.sub(r'"laborTone":"[^"]*"','"laborTone":"red"',b,1)
              b=re.sub(r'"trendDetail":"[^"]*"','"trendDetail":"August employment fell 41.7k versus roughly +15k expected, sharply reversing July strength. Growth had been resilient, but the new labor shock creates a clear conflict for CAD and reduces conviction in a hawkish BoC interpretation."',b,1)
              b=re.sub(r'"weekly":"[^"]*"','"weekly":"CAD now carries a labor downside flag. Treat oil and BoC rhetoric as potential offsets, not automatic bullish confirmation."',b,1)
              s=s[:m.start(1)]+b+s[m.end(1):]

          # Make the old compact calendar show ONLY the coming week; provider rows still add all Medium/High G10 events with forecasts.
          old="let all=[...events.values()].filter(x=>ORDER.includes(x[2])).sort((a,b)=>(a[0]+a[1]).localeCompare(b[0]+b[1]));"
          new="let all=[...events.values()].filter(x=>ORDER.includes(x[2])&&x[0]>='2026-09-07'&&x[0]<='2026-09-13').sort((a,b)=>(a[0]+a[1]).localeCompare(b[0]+b[1]));"
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/restore-old-style-refresh-data.yml
          git commit -m 'Restore old terminal style with Sep 7-11 data'
          git push
