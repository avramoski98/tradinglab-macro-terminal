name: Integrate Commodity and Sector tabs
on:
  push:
    paths:
      - '.github/workflows/integrate-cross-asset-tabs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch terminal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('    <a href="/commodity-cycles.html" style="display:block;border-left:3px solid transparent;color:#a6a6a6;text-decoration:none;padding:9px 9px;text-transform:uppercase;font-size:10px;letter-spacing:.5px">Commodity Cycles</a>\n    <a href="/sector-rotation.html" style="display:block;border-left:3px solid transparent;color:#a6a6a6;text-decoration:none;padding:9px 9px;text-transform:uppercase;font-size:10px;letter-spacing:.5px">Sector Rotation</a>\n', '    <button data-tab="commodity">Commodity Cycles</button>\n    <button data-tab="sector">Sector Rotation</button>\n')
          s=s.replace('  <section id="divergence" class="section"></section>\n  <section id="method" class="section"></section>', '  <section id="divergence" class="section"></section>\n  <section id="commodity" class="section"></section>\n  <section id="sector" class="section"></section>\n  <section id="method" class="section"></section>')
          marker='function divergence(){'
          insert=r'''\nconst COMMODITY_CORE=[\n {sym:'CT',name:'Cotton',phase:'Boll development → early harvest',narr:'NEUTRAL / WEATHER-SENSITIVE',tone:'amber',struct:'MILD BEARISH',driver:'US yield + Texas + India monsoon',next:'Crop Progress · WASDE · Export Sales',meaning:'Harvest can add supply pressure, but yield losses or stronger exports can quickly offset it.',confirm:'Yield/production revisions lower + exports improve',invalidate:'Better harvest + stocks build + weak export demand',keys:/\\b(cotton|textile|texas drought|india monsoon)\\b/i},\n {sym:'ZW',name:'Wheat',phase:'Post-harvest → winter planting',narr:'NEUTRAL / SUPPLY-RISK',tone:'amber',struct:'MILD BULLISH',driver:'Black Sea + EU crop quality + planting weather',next:'WASDE · Black Sea exports · planting',meaning:'Wheat is now more about export availability and new-crop planting risk than harvest weather.',confirm:'Black Sea constraints + lower crop estimates',invalidate:'Large Russian crop/export flow + comfortable stocks',keys:/\\b(wheat|black sea|russia grain|ukraine grain)\\b/i},\n {sym:'SB',name:'Sugar',phase:'Brazil Center-South crush',narr:'NEUTRAL',tone:'blue',struct:'NEUTRAL',driver:'Brazil crush + sugar/ethanol mix + India monsoon',next:'UNICA crush · India policy',meaning:'Brazil supply is the anchor; India weather or a shift toward ethanol can tighten sugar availability.',confirm:'Lower cane yields / more ethanol allocation / India shortfall',invalidate:'Strong Brazil sugar mix + improving India crop',keys:/\\b(sugar|sugarcane|ethanol|unica)\\b/i},\n {sym:'ZC',name:'Corn',phase:'Maturity → harvest',narr:'MILD BEARISH ST',tone:'red',struct:'NEUTRAL / TIGHTER',driver:'US yield vs harvest supply + EU crop losses',next:'Crop Progress · WASDE · Export Sales',meaning:'Harvest increases physical supply near term; bullish reversal needs yield cuts or demand strong enough to absorb it.',confirm:'Yield cuts + strong exports + tighter ending stocks',invalidate:'Higher yield + weak exports + fast harvest',keys:/\\b(corn|maize|corn belt)\\b/i},\n {sym:'KC',name:'Coffee',phase:'Brazil post-harvest → flowering',narr:'WEATHER WATCH',tone:'amber',struct:'NEUTRAL',driver:'Brazil flowering rain + Vietnam crop',next:'Brazil rainfall · crop estimates · certified stocks',meaning:'Next-crop expectations matter more than old-crop supply; flowering weather can reprice coffee very quickly.',confirm:'Poor flowering rain + falling crop estimates/stocks',invalidate:'Good flowering + larger crop estimates',keys:/\\b(coffee|arabica|robusta)\\b/i},\n {sym:'CC',name:'Cocoa',phase:'Main-crop transition',narr:'SUPPLY / WEATHER WATCH',tone:'amber',struct:'TIGHT / VOLATILE',driver:'West Africa weather + arrivals + disease',next:'Port arrivals · grindings · rainfall',meaning:'Supply concentration keeps cocoa sensitive to West African weather and port arrivals; demand destruction is the main counter-force.',confirm:'Weak arrivals + poor weather + resilient grindings',invalidate:'Strong arrivals + improving crop + grinding slowdown',keys:/\\b(cocoa|ivory coast|cote d.?ivoire|ghana cocoa|grindings)\\b/i},\n {sym:'OJ',name:'Orange Juice',phase:'Crop development / hurricane season',narr:'WEATHER RISK',tone:'amber',struct:'TIGHT',driver:'Florida hurricanes + citrus greening + Brazil crop',next:'Hurricane track · crop estimates',meaning:'Structural supply is tight, so hurricane damage can have an outsized bullish effect.',confirm:'Storm damage or lower crop estimates',invalidate:'Benign season + improved Brazil output',keys:/\\b(orange juice|citrus|florida hurricane)\\b/i},\n {sym:'LE',name:'Live Cattle',phase:'Herd contraction / rebuilding',narr:'STRUCTURAL SUPPLY TIGHTNESS',tone:'green',struct:'BULLISH',driver:'Herd size + slaughter + placements + weights',next:'Cattle on Feed · slaughter data',meaning:'Biological lags make supply slow to rebuild, so tight herd numbers can support prices for months.',confirm:'Lower placements/slaughter availability + firm beef demand',invalidate:'Faster herd rebuilding + heavier weights + demand deterioration',keys:/\\b(live cattle|cattle on feed|beef|slaughter)\\b/i},\n {sym:'ZO',name:'Oats',phase:'Harvest / post-harvest',narr:'MILD BEARISH ST',tone:'red',struct:'NEUTRAL',driver:'Canada/US harvest + acreage + stocks',next:'Stocks · crop estimates',meaning:'Fresh harvest supply can pressure oats unless production or stocks disappoint.',confirm:'Lower production/stocks',invalidate:'Large crop + comfortable stocks',keys:/\\b(oats|oat crop)\\b/i},\n {sym:'GF',name:'Feeder Cattle',phase:'Herd contraction / feed-cost cycle',narr:'STRUCTURAL BULLISH',tone:'green',struct:'BULLISH',driver:'Feeder availability + corn/feed costs',next:'Cattle on Feed · corn trend',meaning:'Tight feeder availability supports price, while lower corn costs improve cattle margins and can boost feeder demand.',confirm:'Tight placements + manageable feed costs',invalidate:'Feeder supply rises sharply + margins deteriorate',keys:/\\b(feeder cattle|placements|feed costs)\\b/i},\n {sym:'ZM',name:'Soybean Meal',phase:'US harvest → crush transition',narr:'NEUTRAL',tone:'blue',struct:'NEUTRAL',driver:'Soybean crush + meal demand + South America',next:'Crush data · WASDE · exports',meaning:'Meal depends on crush supply versus livestock/feed demand; stronger crush can increase meal supply even if beans are firm.',confirm:'Lower meal stocks + strong feed/export demand',invalidate:'Heavy crush + weak meal demand',keys:/\\b(soybean meal|meal stocks|soy crush)\\b/i},\n {sym:'ZS',name:'Soybeans',phase:'Pod fill → harvest',narr:'NEUTRAL / HARVEST PRESSURE',tone:'amber',struct:'NEUTRAL',driver:'US yield + China demand + Brazil planting',next:'WASDE · exports · Brazil weather',meaning:'Harvest creates supply pressure, but China demand and South America planting risk decide whether it persists.',confirm:'Yield cuts + China buying + Brazil problems',invalidate:'Strong yield + weak exports + smooth Brazil planting',keys:/\\b(soybeans|soybean|china soy|brazil soy)\\b/i},\n {sym:'ZL',name:'Soybean Oil',phase:'Crush / biofuel demand cycle',narr:'MILD BULLISH',tone:'green',struct:'BULLISH TILT',driver:'Biofuel demand + veg-oil balance + palm oil',next:'Biofuel policy · crush · palm oil',meaning:'Biofuel demand can tighten soybean-oil availability even when soybean crush is strong.',confirm:'Strong biofuel demand + tighter veg-oil stocks',invalidate:'Policy disappointment + large crush supply + weak palm oil',keys:/\\b(soybean oil|biofuel|biodiesel|palm oil)\\b/i}\n];\nfunction commodityHeadline(c){let items=[...(newsData.financialjuice||[]),...(newsData.reuters||[])];let x=items.find(n=>c.keys.test(String(n.title||'')));return x?String(x.title||''):'No major fresh headline in the current live feed.'}\nfunction commodityDesk(){let rows=COMMODITY_CORE.map(c=>`<tr><td><div class="ccy">${c.sym}</div><div class="mini">${c.name}</div></td><td><b>${c.phase}</b></td><td>${tag(c.narr,c.tone)}</td><td>${tag(c.struct,tone(c.struct))}</td><td>${c.driver}</td><td>${c.next}</td><td class="why">${c.meaning}<div class="mini" style="margin-top:5px"><b>CONFIRM:</b> ${c.confirm}<br><b>INVALIDATE:</b> ${c.invalidate}</div></td><td class="why">${esc(commodityHeadline(c))}</td></tr>`).join('');$('#commodity').innerHTML=`<div class="weekhero"><div class="kicker">TRADINGLAB · COMMODITY FUNDAMENTAL CYCLE</div><h2>Physical Phase → Narrative → Next Catalyst</h2><div class="mini" style="font-size:12px">This tab does not duplicate COT, Valuation, Seasonality or HTF Supply/Demand. It answers what phase the market is in, what the current physical narrative is, and what can change it next.</div></div><div class="grid"><div class="card s4"><h3>How to read Phase</h3><div class="call"><b>PHASE = fact.</b> Example: harvest means new supply is physically entering the market. It does not automatically mean price must fall.</div></div><div class="card s4"><h3>How to read Narrative</h3><div class="call"><b>NARRATIVE = interpretation.</b> Production, weather, supply, demand and stocks decide whether the current phase is actually bullish, bearish or neutral.</div></div><div class="card s4"><h3>What This Means For Market</h3><div class="call"><b>Use it as fundamental context.</b> If the physical narrative agrees with COT/Valuation/Seasonality and your HTF zone, conviction improves. If it conflicts, treat it as divergence and wait for confirmation rather than forcing a trade.</div></div><div class="card"><h3>Commodity Fundamental Cycle</h3><div class="tablewrap"><table><thead><tr><th>Market</th><th>Current Phase</th><th>Current Narrative</th><th>Structural</th><th>Key Driver Now</th><th>Next Catalyst</th><th>What This Means For Market</th><th>Live News Note</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`}\nlet SECTOR_STATE=null;\nfunction sectorScore(x){return (Number.isFinite(x.rel1w)?x.rel1w*.45:0)+(Number.isFinite(x.rel1m)?x.rel1m*.55:0)}\nfunction sectorPct(n){return Number.isFinite(n)?`${n>=0?'+':''}${n.toFixed(2)}%`:'—'}\nfunction sectorRegimeText(reg,leaders,laggards){if(reg==='CYCLICAL / RISK-ON')return `Cyclical leadership is broadening. Capital preference is strongest in ${leaders.join(', ')}, while ${laggards.join(', ')} lag. This normally supports a firmer growth/risk-appetite read, but confirm it with yields, credit and G10 before using it as a trade thesis.`;if(reg==='DEFENSIVE / RISK-OFF')return `Defensive leadership is dominating. ${leaders.join(', ')} lead while cyclical sectors lag. This is a warning that investors are reducing economic/risk exposure even if the headline index remains firm.`;return `Rotation is mixed. Leaders are ${leaders.join(', ')} and laggards are ${laggards.join(', ')}, but cyclical versus defensive groups do not agree enough to call a clean regime. Treat this as transition, not a directional signal.`}\nfunction sectorDesk(){if(!SECTOR_STATE){$('#sector').innerHTML='<div class="card"><h3>ETF Sector Rotation</h3><div class="mini">Loading live sector prices…</div></div>';return}let ss=[...SECTOR_STATE.sectors].map(x=>({...x,s:sectorScore(x)})).sort((a,b)=>b.s-a.s),leaders=ss.slice(0,3).map(x=>x.id),laggards=ss.slice(-3).reverse().map(x=>x.id),cyc=['XLY','XLI','XLF','XLE','XLB'],def=['XLP','XLU','XLV'],avg=a=>a.reduce((z,id)=>z+(ss.find(x=>x.id===id)?.s||0),0)/a.length,delta=avg(cyc)-avg(def),reg=delta>.45?'CYCLICAL / RISK-ON':delta<-.45?'DEFENSIVE / RISK-OFF':'MIXED / TRANSITION',regTone=reg.startsWith('CYCLICAL')?'green':reg.startsWith('DEFENSIVE')?'red':'amber';let rows=ss.map(x=>`<tr><td><div class="ccy">${x.id}</div><div class="mini">${x.name}</div></td><td>${Number(x.price).toFixed(2)}</td><td>${sectorPct(x.d1)}</td><td>${sectorPct(x.w1)}</td><td>${sectorPct(x.m1)}</td><td class="${x.rel1w>.25?'good':x.rel1w<-.25?'bad':'warn'}">${sectorPct(x.rel1w)}</td><td class="${x.rel1m>.25?'good':x.rel1m<-.25?'bad':'warn'}">${sectorPct(x.rel1m)}</td><td>${tag(x.s>.35?'IN / LEADER':x.s<-.35?'OUT / LAGGARD':'NEUTRAL',x.s>.35?'green':x.s<-.35?'red':'amber')}</td></tr>`).join('');$('#sector').innerHTML=`<div class="weekhero"><div class="kicker">TRADINGLAB · ETF SECTOR ROTATION</div><h2>${tag(reg,regTone)} · Capital Leadership vs SPY</h2><div class="mini" style="font-size:12px">Relative Strength vs SPY matters more than absolute ETF return. 1W + 1M carry the most weight for the swing/macro read.</div></div><div class="grid"><div class="card s4"><h3>Leaders</h3><div class="metric good">${leaders.join(' · ')}</div><div class="mini">Sectors outperforming SPY on the combined 1W/1M view.</div></div><div class="card s4"><h3>Laggards</h3><div class="metric bad">${laggards.join(' · ')}</div><div class="mini">Sectors losing relative leadership versus SPY.</div></div><div class="card s4"><h3>What This Means For Market</h3><div class="call">${sectorRegimeText(reg,leaders,laggards)}</div></div><div class="card"><h3>Live Sector Rotation</h3><div class="tablewrap"><table><thead><tr><th>Sector / ETF</th><th>Price</th><th>1D</th><th>1W</th><th>1M</th><th>RS 1W vs SPY</th><th>RS 1M vs SPY</th><th>Rotation</th></tr></thead><tbody>${rows}</tbody></table></div><div class="mini" style="margin-top:8px">IN / LEADER = persistent relative outperformance. OUT / LAGGARD = persistent relative underperformance. This is a confirmation layer, not a standalone entry signal.</div></div><div class="card s6"><h3>Macro Ratios · Explanation</h3><div class="call"><b>XLY / XLP</b> rising = stronger risk appetite / cyclical consumer. Falling = defensive consumer preference.<br><br><b>XLI / XLU</b> rising = industrial/cyclical leadership. Falling = defensive/duration preference.<br><br><b>XLF / XLRE</b> rising = financials outperform rate-sensitive real estate; read together with curve, credit and growth.<br><br><b>XLE / SPY</b> rising = energy/inflation leadership; falling = energy lagging broad equities.</div></div><div class="card s6"><h3>How To Use Fundamentally</h3><div class="call"><b>1.</b> Start with the regime.<br><br><b>2.</b> Check if 1W and 1M agree.<br><br><b>3.</b> Focus on Relative Strength vs SPY.<br><br><b>4.</b> Compare with 2Y/10Y, central-bank pricing and G10.<br><br><b>5.</b> If rotation contradicts macro, treat it as a warning/divergence, not automatic invalidation.</div></div></div>`}\nasync function loadSectors(){try{let r=await fetch('/api/sectors',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);SECTOR_STATE=await r.json();sectorDesk()}catch(e){if($('#sector'))$('#sector').innerHTML=`<div class="card"><h3>ETF Sector Rotation</h3><div class="call"><b>Live sector feed unavailable.</b> ${esc(String(e.message||e))}</div></div>`}}\n'''
          if marker not in s:
              raise SystemExit('JS marker not found')
          s=s.replace(marker,insert+'\n'+marker,1)
          s=s.replace("function render(){let st=captureUiScroll();renderMarketTape();overview();$('#g10').innerHTML=table();weekly();calendarFull();live();newsDesk();divergence();method();updateAlertUI();updateNextEvent();updateDataFreshness();restoreUiScroll(st)}", "function render(){let st=captureUiScroll();renderMarketTape();overview();$('#g10').innerHTML=table();weekly();calendarFull();live();newsDesk();divergence();commodityDesk();sectorDesk();method();updateAlertUI();updateNextEvent();updateDataFreshness();restoreUiScroll(st)}")
          s=s.replace("const titles={overview:'Macro Overview',g10:'G10 Macro Monitor',weekly:'Weekly Focus',calendar:'Next Week Calendar',live:'Live Macro',news:'Live News Desk',divergence:'Macro Divergence',method:'Framework'};", "const titles={overview:'Macro Overview',g10:'G10 Macro Monitor',weekly:'Weekly Focus',calendar:'Next Week Calendar',live:'Live Macro',news:'Live News Desk',divergence:'Macro Divergence',commodity:'Commodity Cycles',sector:'Sector Rotation',method:'Framework'};")
          s=s.replace("render();loadMarkets();loadLive();loadNews();checkEventReminders();setInterval(loadMarkets,15000);setInterval(loadLive,30000);setInterval(loadNews,15000);", "render();loadMarkets();loadLive();loadNews();loadSectors();checkEventReminders();setInterval(loadMarkets,15000);setInterval(loadLive,30000);setInterval(loadNews,15000);setInterval(loadSectors,60000);")
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'data-tab="commodity"' index.html
          grep -q 'data-tab="sector"' index.html
          grep -q 'id="commodity" class="section"' index.html
          grep -q 'id="sector" class="section"' index.html
          grep -q 'What This Means For Market' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate commodity and sector rotation into terminal tabs"
          git push
