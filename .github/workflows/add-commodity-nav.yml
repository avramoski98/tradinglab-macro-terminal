name: Add Commodity Navigation

on:
  push:
    paths:
      - '.github/workflows/add-commodity-nav.yml'

permissions:
  contents: write

jobs:
  patch-terminal-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Commodity Cycles to sidebar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '    <button data-tab="divergence">Divergence</button>\n'
          link = '    <a href="/commodity-cycles.html" style="display:block;border-left:3px solid transparent;color:#a6a6a6;text-decoration:none;padding:9px 9px;text-transform:uppercase;font-size:10px;letter-spacing:.5px">Commodity Cycles</a>\n'
          if '/commodity-cycles.html' not in s:
              if marker not in s:
                  raise SystemExit('Navigation marker not found')
              s = s.replace(marker, marker + link, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Commodity Cycles to terminal navigation"
          git push
