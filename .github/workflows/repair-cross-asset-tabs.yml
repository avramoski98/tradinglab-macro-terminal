name: Repair cross asset tabs
on:
  push:
    paths:
      - '.github/workflows/repair-cross-asset-tabs.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair integrated JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('\\n','\n').replace('\\\\b','\\b')
          needle='const COMMODITY_CORE=['
          first=s.index(needle)
          try:
              second=s.index(needle,first+1)
          except ValueError:
              second=-1
          if second!=-1:
              end=s.index('function divergence(){',second)
              s=s[:second]+s[end:]
          p.write_text(s)
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/terminal.js').write_text(script)
          PY
          node --check /tmp/terminal.js
          test "$(grep -o 'const COMMODITY_CORE=' index.html | wc -l)" -eq 1
          test "$(grep -o 'let SECTOR_STATE=' index.html | wc -l)" -eq 1
          grep -q 'data-tab="commodity"' index.html
          grep -q 'data-tab="sector"' index.html
          grep -q 'What This Means For Market' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Repair integrated commodity and sector tabs"
          git push
