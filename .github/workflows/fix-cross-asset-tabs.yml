name: Fix cross asset tab script
on:
  push:
    paths:
      - '.github/workflows/fix-cross-asset-tabs.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix escaped newlines and verify JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('\\nconst COMMODITY_CORE=[\\n')
          end=s.index('function divergence(){',start)
          block=s[start:end]
          block=block.replace('\\n','\n').replace('\\\\b','\\b')
          s=s[:start]+block+s[end:]
          p.write_text(s)
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/terminal.js').write_text(script)
          PY
          node --check /tmp/terminal.js
          grep -q 'data-tab="commodity"' index.html
          grep -q 'data-tab="sector"' index.html
          grep -q 'What This Means For Market' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix integrated commodity and sector tab script"
          git push
