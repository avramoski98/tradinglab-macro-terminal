name: Run cross asset integration
on:
  push:
    paths:
      - '.github/workflows/run-cross-asset-integration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Load integration patch
        run: |
          git fetch origin integrate-cross-asset-tabs
          git show origin/integrate-cross-asset-tabs:.github/workflows/integrate-cross-asset-tabs.yml > /tmp/integration.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          y=Path('/tmp/integration.yml').read_text()
          start=y.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=y.index("\n          PY",start)
          code=textwrap.dedent(y[start:end])
          exec(compile(code,'integration-patch','exec'))
          PY
      - name: Verify and commit
        run: |
          grep -q 'data-tab="commodity"' index.html
          grep -q 'data-tab="sector"' index.html
          grep -q 'What This Means For Market' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate commodity and sector rotation into terminal tabs"
          git push
