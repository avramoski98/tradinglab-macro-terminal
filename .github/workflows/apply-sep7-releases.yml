name: Apply Sep 7 releases

on:
  push:
    branches: [main]
    paths:
      - tools/add_sep7_releases.py
      - .github/workflows/apply-sep7-releases.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add EUR and GBP releases
        run: python tools/add_sep7_releases.py
      - name: Verify JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/terminal.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/terminal.js
      - name: Commit terminal update
        run: |
          git config user.name "TradingLab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "Update Sep 7 EUR and GBP macro releases"
          git push origin HEAD:main
