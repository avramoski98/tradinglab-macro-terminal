name: Fix Sep 7 calendar pending rows

on:
  push:
    branches: [main]
    paths:
      - tools/fix_sep7_calendar_pending.py
      - .github/workflows/fix-sep7-calendar-pending.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct released calendar rows
        run: python tools/fix_sep7_calendar_pending.py
      - name: Verify JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/terminal.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/terminal.js
      - name: Commit calendar correction
        run: |
          git config user.name "TradingLab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "Fix released Sep 7 calendar rows"
          git push origin HEAD:main
