name: Fix G10 rank order
on:
  push:
    paths:
      - '.github/workflows/fix-g10-rank-order.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix matrix ranking order only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Keep UI/data intact. Only force the displayed matrix order to follow RES.order 1..10.
          s=re.sub(r"function currentOrder\(\)\{return \[\.\.\.ORDER\]\.sort\(\(a,b\)=>liveStrength\(b\)-liveStrength\(a\)\|\|RES\[a\]\.order-RES\[b\]\.order\)\}",
                   "function currentOrder(){return [...ORDER].sort((a,b)=>Number(RES[a].order||99)-Number(RES[b].order||99))}",s,count=1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix G10 matrix rank order 1 to 10' || exit 0
          git rm .github/workflows/fix-g10-rank-order.yml
          git commit -m 'Remove temporary rank-order workflow'
          git push
