name: Apply Sep 10 macro releases

on:
  push:
    branches: [main]
    paths:
      - tools/apply_sep10_releases.py
      - .github/workflows/apply-sep10-releases.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply released macro data and G10 update
        run: python tools/apply_sep10_releases.py
      - name: Verify JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/terminal.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          nl -ba /tmp/terminal.js | sed -n '10,40p'
          node --check /tmp/terminal.js
      - name: Verify locked Sep 10 releases
        run: |
          grep -q '"2026-09-10","14:30","USD","Core PPI · Aug"' index.html
          grep -q '"2026-09-10","14:15","EUR","ECB Rate Decision"' index.html
          grep -q '"2026-09-10","16:00","USD","Existing Home Sales · Aug"' index.html
          grep -q "event:'PPI y/y · Aug'" index.html
      - name: Commit terminal update
        run: |
          git config user.name "TradingLab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "Update Sep 10 macro releases and G10 bias"
          git push origin HEAD:main
