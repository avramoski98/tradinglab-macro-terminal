name: Fix weekly catalyst scoring and duplicate releases
on:
  push:
    paths:
      - '.github/workflows/fix-weekly-catalysts-2026-09-13.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalyst engine only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="function catalystKind(ev=''){let s=String(ev).toLowerCase();if(/core.*(cpi|pce)|trimmed mean|median cpi|cpif/.test(s))return'CORE INFLATION';if(/\\b(cpi|pce|hicp|inflation)\\b/.test(s))return'INFLATION';if(/non.?farm|\\bnfp\\b|payroll/.test(s))return'NFP';if(/unemployment/.test(s))return'UNEMPLOYMENT';if(/wage|average hourly|earnings growth/.test(s))return'WAGES';if(/rate decision|interest rate|policy rate|ocr|cash rate|bank rate/.test(s))return'RATE';if(/ism.*services|services.*ism/.test(s))return'ISM SERVICES';if(/ism.*manufacturing|manufacturing.*ism/.test(s))return'ISM MANUFACTURING';if(/\\bgdp\\b/.test(s))return'GDP';if(/jolts|job openings/.test(s))return'JOLTS';if(/jobless|claims/.test(s))return'CLAIMS';if(/services pmi/.test(s))return'SERVICES PMI';if(/manufacturing pmi/.test(s))return'MANUFACTURING PMI';if(/retail sales/.test(s))return'RETAIL SALES';if(/industrial production/.test(s))return'INDUSTRIAL PRODUCTION';return'MACRO'}"
          new="function catalystKind(ev=''){let s=String(ev).toLowerCase();if(/federal budget|budget balance|fiscal balance|government budget/.test(s))return'FISCAL';if(/core.*(cpi|pce)|trimmed mean|median cpi|cpif/.test(s))return'CORE INFLATION';if(/\\b(cpi|pce|hicp|inflation)\\b/.test(s))return'INFLATION';if(/non.?farm|\\bnfp\\b|payroll/.test(s))return'NFP';if(/unemployment/.test(s))return'UNEMPLOYMENT';if(/wage|average hourly|earnings growth/.test(s))return'WAGES';if(/rate decision|interest rate|policy rate|ocr|cash rate|bank rate/.test(s))return'RATE';if(/ism.*services|services.*ism/.test(s))return'ISM SERVICES';if(/ism.*manufacturing|manufacturing.*ism/.test(s))return'ISM MANUFACTURING';if(/\\bgdp\\b/.test(s))return'GDP';if(/jolts|job openings/.test(s))return'JOLTS';if(/jobless|claims/.test(s))return'CLAIMS';if(/services pmi/.test(s))return'SERVICES PMI';if(/manufacturing pmi/.test(s))return'MANUFACTURING PMI';if(/retail sales/.test(s))return'RETAIL SALES';if(/industrial production/.test(s))return'INDUSTRIAL PRODUCTION';return'MACRO'}"
          if old in s: s=s.replace(old,new,1)

          old2="function catalystWeight(kind){return ({'CORE INFLATION':3,'INFLATION':2.5,'NFP':3,'UNEMPLOYMENT':2.75,'WAGES':2.25,'RATE':3,'ISM SERVICES':2.25,'ISM MANUFACTURING':1.75,'GDP':2,'JOLTS':1.5,'CLAIMS':1.25,'SERVICES PMI':1.5,'MANUFACTURING PMI':1.25,'RETAIL SALES':1.5,'INDUSTRIAL PRODUCTION':1.25}[kind]||1)}"
          new2="function catalystWeight(kind){let m={'FISCAL':0,'CORE INFLATION':3,'INFLATION':2.5,'NFP':3,'UNEMPLOYMENT':2.75,'WAGES':2.25,'RATE':3,'ISM SERVICES':2.25,'ISM MANUFACTURING':1.75,'GDP':2,'JOLTS':1.5,'CLAIMS':1.25,'SERVICES PMI':1.5,'MANUFACTURING PMI':1.25,'RETAIL SALES':1.5,'INDUSTRIAL PRODUCTION':1.25};return Object.prototype.hasOwnProperty.call(m,kind)?m[kind]:1}"
          if old2 in s: s=s.replace(old2,new2,1)

          marker="function allCatalysts(){"
          helper="function canonicalCatalystEvent(v=''){return String(v).toLowerCase().replace(/m\\/m|month[- ]over[- ]month/g,'mom').replace(/y\\/y|year[- ]over[- ]year/g,'yoy').replace(/\\b(aug|sep|jul|jun|may|apr|mar|feb|jan)\\b/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\\s+/g,' ').trim()}\n"
          if helper.strip() not in s and marker in s: s=s.replace(marker,helper+marker,1)

          oldkey="let key=[u.ccy,skopjeDate(u.date),u.kind||catalystKind(u.event),u.event,u.actual].join('|');"
          newkey="let key=[u.ccy,skopjeDate(u.date),canonicalCatalystEvent(u.event),String(u.actual)].join('|');"
          s=s.replace(oldkey,newkey)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix weekly catalyst scoring and duplicate CPI rows' || exit 0
          git push
          rm -f .github/workflows/fix-weekly-catalysts-2026-09-13.yml
          git add .github/workflows/fix-weekly-catalysts-2026-09-13.yml
          git commit -m 'Remove one-shot catalyst patch workflow' || true
          git push || true