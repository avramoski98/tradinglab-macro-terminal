name: Refresh G10 data Sep 13 2026
on:
  push:
    paths:
      - '.github/workflows/refresh-g10-2026-09-13.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh G10 data only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const RES=(\{.*?\});\nconst STATIC_RELEASES=',s,re.S)
          if not m: raise SystemExit('RES block not found')
          R=json.loads(m.group(1))
          order=['JPY','AUD','USD','NOK','EUR','GBP','NZD','CHF','CAD','SEK']
          for i,c in enumerate(order,1): R[c]['order']=i
          updates={
          'JPY':dict(final='VERY BULLISH',macro='STRENGTHENING',confidence='HIGH',rate='1.00%',cb='HAWKISH',next='18 Sep: +25bp to 1.25% is nearly/full priced; guidance on the next hike is the real catalyst',pricing='HIKE FULLY / NEAR-FULLY PRICED',weekly='BoJ is expected to hike to 1.25% on 18 Sep. Rising domestic yields, repatriation risk and the yen rebound make JPY the strongest policy-momentum story, but sell-the-fact risk is high because the hike is already heavily priced.',why='JPY moves to #1 because the BoJ is in an active normalization cycle while most peers are either already priced or less clearly tightening. The next move is broadly expected, so conviction depends on guidance and JGB/FX confirmation.'),
          'AUD':dict(final='BULLISH',macro='INFLATION-LED / HAWKISH',confidence='HIGH',y2='Australia 2Y ~5.0% · 11 Sep',pricing='HAWKISH REPRICING',weekly='Sticky inflation and a sharp rise in Australia 2Y yields keep the RBA reaction function among the most hawkish in G10. Labor remains the main conflict, so AUD is strong but not clean enough for #1.',why='AUD ranks #2 because inflation remains above the RBA comfort zone and front-end yields have repriced aggressively higher. Softer labor/growth prevents a top rank.'),
          'USD':dict(final='BULLISH',macro='HAWKISH REPRICING / RESILIENT',confidence='HIGH',core='Core CPI 2.4% y/y · 0.3% m/m · Aug',inflation='Headline CPI 3.4% y/y · Aug',cb='HAWKISH REPRICING',next='16 Sep FOMC: ~85% market pricing for +25bp; path after the meeting matters more than the hike itself',y2='US 2Y ~4.60% · 11 Sep',pricing='~85% HIKE PRICED',weekly='Hotter core CPI plus strong August payrolls lifted September hike pricing to roughly 85%. USD is fundamentally supported, but the hike is heavily priced and political pressure for lower rates creates a conflict. Watch US2Y after the FOMC.',why='USD ranks #3: labor, inflation and front-end yields all support tightening, but much of the September move is already priced. The next USD leg depends on Fed guidance, not simply the hike itself.'),
          'NOK':dict(final='BULLISH',macro='RESTRICTIVE / ENERGY-SUPPORTED',confidence='MEDIUM-HIGH',core='CPI-ATE 3.0% · Aug',inflation='Headline CPI 3.3% · Aug',weekly='NOK improves on a restrictive 4.25% policy rate, inflation still above target and the renewed oil/energy shock. Global risk-off is the main override because high oil can help Norway while hurting broad risk appetite.',why='NOK ranks #4 because restrictive rates plus elevated energy prices improve the relative macro backdrop. Growth is not strong enough for top-3 conviction and risk-off flows can still interfere.'),
          'EUR':dict(order=5,final='BULLISH',macro='STRENGTHENING / POST-HIKE',confidence='HIGH',core='Core HICP 2.4% · Aug flash',inflation='Headline HICP 3.3% · Aug',rate='2.50% deposit',lastDecision='Hike +25bp · 10 Sep',cb='HAWKISH / DATA-DEPENDENT',next='Post-hike: further tightening remains optional; final HICP and front-end yields must confirm',pricing='HAWKISH BUT HIKE DELIVERED',weekly='ECB delivered the 25bp hike and upgraded medium-term inflation projections. EUR remains fundamentally strong, but it is no longer the cleanest #1 because the hike has already been delivered while JPY/AUD/USD currently have stronger marginal policy repricing.',why='EUR is still strong, but drops to #5 on relative momentum. The ECB hike supports the currency, yet the marginal repricing impulse is now stronger in JPY, AUD and USD, while NOK gains from the energy shock.'),
          'GBP':dict(order=6,final='MILD BULLISH',macro='MIXED / RATES-SUPPORTED',confidence='MEDIUM',y2='UK 2Y ~4.81% · 11 Sep',pricing='NOV HIKE RISK HIGH',weekly='UK front-end yields remain elevated and markets price substantial November hike risk, but labor weakness and fiscal/bond stress reduce conviction. This is a rate-supportive but conflict-heavy GBP backdrop.',why='GBP moves above the weaker half of G10 because front-end yields and policy expectations remain supportive. Labor and fiscal stress keep it below the top tier.'),
          'NZD':dict(order=7,final='MILD BULLISH',macro='MIXED / INFLATION-LED',confidence='MEDIUM',rate='2.75%',lastDecision='Hike +25bp · 2 Sep',next='RBNZ says further gradual hikes may be needed; official path trends toward ~3.2%',pricing='FURTHER HIKES POSSIBLE',weekly='RBNZ hiked to 2.75% and kept further gradual tightening in the central path. The conflict is large: headline inflation is 4.1%, but unemployment is 5.6% and core inflation is much closer to target.',why='NZD stays mildly bullish on policy, but weak labor and spare capacity keep it below GBP/EUR/NOK.'),
          'CHF':dict(order=8,final='NEUTRAL',macro='LOW-INFLATION / SAFE-HAVEN',confidence='MEDIUM',pricing='HOLD ~FULLY PRICED',weekly='SNB at 0% and very low inflation keep the domestic macro weak, but geopolitical stress gives CHF a strong Risk Override. Treat it as neutral rather than structurally bearish in the current regime.',why='CHF ranks #8: poor carry and low domestic inflation are negative, but safe-haven demand prevents a clean bearish classification.'),
          'CAD':dict(order=9,final='NEUTRAL / BEARISH',macro='LABOR-WEAK / OIL-OFFSET',confidence='MEDIUM',rate='2.25%',lastDecision='Hold · 2 Sep',cb='NEUTRAL',next='14 Sep CPI is the key test after August employment -41.7k',pricing='HOLD / DATA-DEPENDENT',weekly='August employment fell 41.7k, materially weakening CAD domestic momentum. Higher oil is an offset, not a full repair. CPI and Canada 2Y need to re-accelerate to restore conviction.',why='CAD falls to #9 because labor deteriorated sharply and the BoC is on hold. Oil support is meaningful but creates a conflict rather than a clean bullish thesis.'),
          'SEK':dict(order=10,final='BEARISH',macro='LOW-INFLATION / POLICY-CONSTRAINED',confidence='MEDIUM-HIGH',core='CPIF-XE 0.5% · Aug flash',inflation='CPIF 0.7% · Aug flash',cb='NEUTRAL / LESS HAWKISH',next='24 Sep Riksbank: low inflation sharply reduces urgency to tighten',pricing='HIKE CASE WEAKENED',weekly='August CPIF and CPIF-XE are far below the 2% target. Stronger Q2 growth is not enough to offset the collapse in inflation pressure, so SEK becomes the weakest relative policy story.',why='SEK ranks #10 because inflation is far below target and the tightening case has weakened materially. Growth resilience is not enough to offset the policy divergence.'),
          }
          for c,u in updates.items(): R[c].update(u)
          block='const RES='+json.dumps(R,separators=(',',':'),ensure_ascii=False)+';\nconst STATIC_RELEASES='
          s=s[:m.start()]+block+s[m.end():]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh G10 macro ranking for Sep 14-18' || true
          rm -f .github/workflows/refresh-g10-2026-09-13.yml
          git add -A
          git commit -m 'Remove one-time G10 refresh workflow' || true
          git push
