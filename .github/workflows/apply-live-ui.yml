name: Apply TradingLab live UI upgrade

on:
  push:
    branches: [main]
    paths:
      - tools/upgrade_live_ui.py
      - tools/calendar_live_patch.py
      - tools/news_resilience_patch.py
      - .github/workflows/apply-live-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch terminal UI
        run: python tools/upgrade_live_ui.py
      - name: Set 15-second news refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('FinancialJuice headlines refresh every 60 seconds','FinancialJuice headlines refresh every 15 seconds')
          s=s.replace('Auto refresh: 60s · high-impact macro / regime changes glow red','Auto refresh: 15s · high-impact macro / regime changes glow red')
          s=s.replace('FinancialJuice headlines refresh every 60 seconds.','FinancialJuice headlines refresh every 15 seconds.')
          s=s.replace('setInterval(loadNews,60000)','setInterval(loadNews,15000)')
          p.write_text(s)
          PY
      - name: Update calendar release status
        run: python tools/calendar_live_patch.py
      - name: Preserve last good FinancialJuice feed
        run: python tools/news_resilience_patch.py
      - name: Commit upgraded terminal
        run: |
          git config user.name "TradingLab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html api/news.js
          if git diff --cached --quiet; then
            echo "No UI changes needed"
            exit 0
          fi
          git commit -m "Keep FinancialJuice headlines during feed retries"
          git push origin HEAD:main
