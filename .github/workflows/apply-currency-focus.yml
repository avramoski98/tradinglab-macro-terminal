name: Apply dynamic Currency Focus

on:
  push:
    branches: [main]
    paths:
      - tools/currency_focus_patch.py
      - .github/workflows/apply-currency-focus.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Synchronize Currency Focus with live macro catalysts
        run: python tools/currency_focus_patch.py
      - name: Commit terminal update
        run: |
          git config user.name "TradingLab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Currency Focus already synchronized"
            exit 0
          fi
          git commit -m "Auto-update Currency Focus from live macro catalysts"
          git push origin HEAD:main
