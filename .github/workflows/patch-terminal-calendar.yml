name: Patch stale terminal calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-terminal-calendar.yml'

permissions:
  contents: write

jobs:
  patch-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct static calendar schedule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('["2026-09-16","14:30","USD","Initial Jobless Claims"', '["2026-09-17","14:30","USD","Initial Jobless Claims"'),
              ("'2026-09-16|Initial Jobless Claims':'~207K'", "'2026-09-17|Initial Jobless Claims':'~209K'"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "TradingLab Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Correct Sep 16/17 jobless claims schedule [skip ci]"
          git push
