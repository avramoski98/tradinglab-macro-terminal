name: Run commodity style restore
on:
  push:
    paths:
      - '.github/workflows/run-restore-commodity-style.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/restore_commodity_style.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/terminal.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/terminal.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore old Commodity Cycles style while keeping current data"
          git push
